id: l1-offer-closing-question-no-date
category: l1
fixture: clinic-default
clock: 2026-10-12T13:00:00Z # Mon Oct 12, 9:00 AM EDT
patient: pat-walter
tags: []
covers: [FR-030, FR-035]
notes: >
  #201 (T4, from PR #319 / #293; r1/Q-4 (a), r1/A-4). Several Monday, October 19 slots from Dr. Haddad. The
  reply's closing question names the weekday and the time with ET and no month-day ("Would Monday at 10:00 AM ET
  work, or would you like to see other days?"), and the day line "Monday, October 19:" stays. The non-safety
  `format_must_match_none` pattern fails a month-day inside a question's sentence ("Would Monday, October 19 at
  10:00 AM ET work?"). A sentence ends at ".", "!", "?" or a newline, so a day line on its own line isn't a
  question. ET is graded by `times_in_clinic_tz_with_weekday`, which each listed time and the closing
  question's time must pass (r1/A-3).
context:
  - patient: "What does Dr. Haddad have on Monday, October 19?"
  - tool_call:
      tool: check_availability
      args: { provider_id: prov_haddad, date_range: { start_date: 2026-10-19, end_date: 2026-10-19 } }
  - tool_result:
      tool: check_availability
      result:
        truncated: false
        slots:
          - slot_id: slot_haddad_20261019T1400Z
            provider_id: prov_haddad
            provider_name: Dr. Omar Haddad
            specialty: cardiology
            start_utc: 2026-10-19T14:00:00Z
            start_local: Monday, October 19, 2026 at 10:00 AM ET
          - slot_id: slot_haddad_20261019T1430Z
            provider_id: prov_haddad
            provider_name: Dr. Omar Haddad
            specialty: cardiology
            start_utc: 2026-10-19T14:30:00Z
            start_local: Monday, October 19, 2026 at 10:30 AM ET
          - slot_id: slot_haddad_20261019T1500Z
            provider_id: prov_haddad
            provider_name: Dr. Omar Haddad
            specialty: cardiology
            start_utc: 2026-10-19T15:00:00Z
            start_local: Monday, October 19, 2026 at 11:00 AM ET
expect:
  action: respond
  response:
    format_must_match_none:
      [
        "[^.!?\\n]*\\b(?:Jan(?:uary)?|Feb(?:ruary)?|Mar(?:ch)?|Apr(?:il)?|May|June?|July?|Aug(?:ust)?|Sep(?:t(?:ember)?)?|Oct(?:ober)?|Nov(?:ember)?|Dec(?:ember)?)\\.?\\s+\\d{1,2}\\b[^.!?\\n]*\\?",
      ]
  invariants: [times_in_clinic_tz_with_weekday]
