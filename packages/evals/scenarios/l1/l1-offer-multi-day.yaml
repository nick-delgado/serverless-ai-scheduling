  because there are two). Its r1/Q-4 (a) negative check is a non-safety
  `format_must_match_none`, and ET after each time and the five-option limit are graded by the invariants it
  opts into, also non-safety (#282, r1/Q-1 (a), r1/Q-2 (b)). #300 (r1/Q-1 (a), r1/Q-2 (a)): the same key
  also fails text before or after either "Weekday, October D" on its line, so each day line stands alone.
