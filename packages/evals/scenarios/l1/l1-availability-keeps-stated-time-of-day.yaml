id: l1-availability-keeps-stated-time-of-day
category: l1
fixture: clinic-default
clock: 2026-10-05T13:00:00Z # Mon Oct 5, 9:00 AM EDT
patient: pat-maria
tags: []
covers: [FR-030]
notes: >
  #306 (r1/Q-3 (a), r1/Q-4 (a)), modelled on Eval gate run 38958895946: the patient asked for an afternoon,
  was offered Monday, Oct 12, and now asks for an earlier date with someone else. The next check_availability
  must keep the afternoon: one call whose range ends on Thursday, Oct 8, or a call for Oct 8 alone (the per-day
  search), each with time_of_day afternoon or start_time 12:00. The observed failure, the same dates with no
  time, fails, and so do time_of_day morning or any. The gap: this checks that some call keeps the time, so a
  reply with one timed call and other untimed ones passes. Provider and specialty are not pinned, because
  "someone else" is searched either way.
