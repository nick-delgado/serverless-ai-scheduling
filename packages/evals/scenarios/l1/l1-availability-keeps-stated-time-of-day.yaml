  - tool_call:
      tool: check_availability
      args:
        specialty: dermatology
        date_range: { start_date: 2026-10-12, end_date: 2026-10-16 }
        time_of_day: afternoon
  - tool_result:
      tool: check_availability
      result:
        truncated: true
        slots:
          - slot_id: slot_lee_20261012T1600Z
            provider_id: prov_lee
            provider_name: Dr. Priya Lee
            specialty: dermatology
            start_utc: 2026-10-12T16:00:00Z
            start_local: Monday, October 12, 2026 at 12:00 PM ET
          - slot_id: slot_okafor_20261012T1600Z
