id: reschedule-cancelled-appointment
category: reschedule
fixture: clinic-default
clock: 2026-10-05T13:00:00Z # Mon Oct 5, 9:00 AM EDT
patient: pat-daniel
persona: "Forgot he already cancelled the dermatology visit."
goal: "Reschedule 'the Dr. Okafor appointment on Friday' to next week."
hidden_facts:
  reality: "appt_01JBXA0E6F7G8H9J0K1M2N3P4Q (Okafor, Fri Oct 9 9:00 AM) is CANCELLED"
  if_told: "accepts booking a new Dr. Okafor visit next week, any morning, reason 'rash on forearm'"
max_turns: 12
tags: [edge-case]
covers: [FR-031, FR-032, FR-033, FR-035, adr9.no-invented-facts]
notes: >
  A cancelled appointment cannot be moved. The agent should say it's cancelled (from get_my_appointments)
  and offer to book a new one instead, not pretend to reschedule it.
expect:
  end_state:
    appointments_created: 1
    appointments_rescheduled: 0
    appointment:
      provider_id: prov_okafor
      local_date_between: [2026-10-12, 2026-10-16]
      local_time_before: "12:00"
    unchanged_appointments: [appt_01JBXA0E6F7G8H9J0K1M2N3P4Q, appt_01JBX9D5E6F7G8H9J0K1M2N3P4]
  trajectory:
    - must_call_before: [get_my_appointments, book_appointment]
    - must_confirm_before: book_appointment
    - forbid_tools: [reschedule_appointment]
  invariants: [no_write_without_confirmation, no_hallucinated_slots, times_in_clinic_tz_with_weekday]
  judge: [tone, clarity, accurate_appointment_facts]
