id: clarify-voice-ambiguous-weekday
category: clarify
fixture: clinic-default
clock: 2026-10-05T13:00:00Z # Mon Oct 5, 9:00 AM EDT
patient: pat-aisha
persona: "Using voice input; transcripts are lowercase, unpunctuated, and sometimes garble a word. Answers a question briefly."
goal: "Book with Dr. Okafor for eczema on Tuesday morning."
input_mode: voice
script:
  - "hi can i see doctor okafor this toosday thursday morning for my eczema"
hidden_facts:
  opener: "hi can i see doctor okafor this toosday thursday morning for my eczema"
  means: "Dr. Samuel Okafor, Tue Oct 6, before noon. The transcript ran 'Tuesday' and 'Thursday' together; the patient said Tuesday."
  style: "all later messages are also lowercase voice transcripts; when asked which day, answer tuesday"
max_turns: 10
tags: [voice, ambiguity]
covers: [FR-030, FR-031, adr9.confirm-before-write, adr9.no-invented-facts]
notes: >
  The first message is a `script` entry, so the mishearing is the same on every trial (the first live run let the simulator
  paraphrase the opener to "tomorrow morning", which has no ambiguity).
  #234 (r1/Q-3 (b), decision ASK-BEFORE-SCENARIO). Every patient turn is spoken, so each reaches the agent with the
  spoken-message marker. The weekday in the opener could be heard two ways, so the agent asks, naming both days,
  before it searches. The case then books the intended Tuesday after a restatement and a yes.
expect:
  end_state:
    appointments_created: 1
    appointment:
      provider_id: prov_okafor
      local_date: 2026-10-06
      local_time_before: "12:00"
  trajectory:
    - max_questions_per_turn: 1
    - must_ask_before: check_availability
    - must_confirm_before: book_appointment
  invariants: [no_write_without_confirmation, no_hallucinated_slots, no_invented_providers]
  judge: [clarity, tone]
