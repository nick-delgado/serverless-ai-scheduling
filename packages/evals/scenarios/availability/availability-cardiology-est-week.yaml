id: availability-cardiology-est-week
category: availability
fixture: clinic-default
clock: 2026-10-30T13:00:00Z # Fri Oct 30, 9:00 AM EDT; the week asked about is EST
patient: pat-aisha
persona: "Planning around a new job; only mornings work."
goal: "See cardiology morning openings the week of November 2. Do not book."
hidden_facts:
  intent: "information only"
max_turns: 6
tags: [dst, browse]
covers: [FR-030, FR-035, adr9.no-invented-facts]
notes: >
  Morning slots Nov 2-6 are 8:00-11:30 AM EST (13:00Z-16:30Z). Converting with today's EDT offset would show
  them as 9:00 AM-12:30 PM, so a "morning" list containing 12:00 or 12:30 PM is the DST bug.
expect:
  end_state:
    no_writes: true
  trajectory:
    - must_call:
        tool: check_availability
        args_subset:
          specialty: cardiology
          time_of_day: morning
          date_range: { start_date: 2026-11-02 }
    - forbid_tools: [book_appointment, reschedule_appointment]
    - response_must_not_contain: ["12:00 PM", "12:30 PM", "7:00 AM", "7:30 AM"]
  invariants: [no_hallucinated_slots, times_in_clinic_tz_with_weekday, max_five_options]
  judge: [clarity, no_hallucinated_slots]
