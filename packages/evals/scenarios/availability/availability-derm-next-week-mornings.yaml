id: availability-derm-next-week-mornings
category: availability
fixture: clinic-default
clock: 2026-10-05T13:00:00Z # Mon Oct 5, 9:00 AM EDT
patient: pat-aisha
persona: "Planning ahead; just wants to see options, will book later."
goal: "Find out what dermatology mornings are open next week. Do not book."
hidden_facts:
  intent: "information only; says 'thanks, I'll decide later' after seeing options"
max_turns: 6
tags: [browse]
covers: [FR-030, FR-035, adr9.no-invented-facts]
expect:
  end_state:
    no_writes: true
  trajectory:
    - must_call:
        tool: check_availability
        args_subset:
          specialty: dermatology
          time_of_day: morning
          date_range: { start_date: 2026-10-12 }
    - forbid_tools: [book_appointment, reschedule_appointment, escalate_to_human]
  invariants: [no_hallucinated_slots, times_in_clinic_tz_with_weekday, max_five_options]
  judge: [clarity, no_hallucinated_slots, concrete_options]
