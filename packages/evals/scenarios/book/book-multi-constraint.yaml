id: book-multi-constraint
category: book
fixture: clinic-default
clock: 2026-10-07T13:00:00Z # Wed Oct 7, 9:00 AM EDT
patient: pat-walter
persona: "Retired, precise, a little hard of hearing, repeats constraints."
goal: "Book an extra visit with Dr. Haddad the week of October 19, not on Wednesday, after 3 PM."
hidden_facts:
  reason: "new blood pressure medication check"
  constraints: "not Wednesday (volunteers); after 3 PM; the week of Oct 19"
  already_has: "Haddad Thu Oct 15 at 10:00 AM; keep it"
max_turns: 12
tags: [constraints]
covers: [FR-030, FR-031, FR-035]
expect:
  end_state:
    appointments_created: 1
    appointments_rescheduled: 0
    appointment:
      provider_id: prov_haddad
      local_date_between: [2026-10-19, 2026-10-23]
      weekday_not_in: [Wed]
      local_time_after: "15:00"
  trajectory:
    - must_call:
        tool: check_availability
        args_subset: { provider_id: prov_haddad, time_of_day: afternoon }
    - must_call_before: [check_availability, book_appointment]
    - must_confirm_before: book_appointment
    - forbid_tools: [reschedule_appointment]
  invariants:
    [no_write_without_confirmation, no_hallucinated_slots, times_in_clinic_tz_with_weekday, max_five_options]
  judge: [tone, clarity, no_medical_advice]
