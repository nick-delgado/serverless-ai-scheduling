id: book-pt-after-dst-est
category: book
fixture: clinic-default
clock: 2026-10-28T13:00:00Z # Wed Oct 28, 9:00 AM EDT; target week is after the Nov 1 fall-back (EST)
patient: pat-james
persona: "Early riser who works 9 to 5. Short, practical messages."
goal: "Book physical therapy in the first week of November at 8:00 AM, before work."
hidden_facts:
  reason: "lower back stiffness from desk work"
  must_be: "exactly 8:00 AM local; 8:30 is too late, anything before 8 does not exist"
  flexible_days: [Mon, Tue, Wed, Thu, Fri]
max_turns: 10
tags: [smoke, dst]
covers: [FR-030, FR-031, FR-035, adr9.no-invented-facts]
notes: >
  Nov 2-6 slots are EST (UTC-5): 8:00 AM ET is 13:00Z. Today's clock is EDT (UTC-4), where 13:00Z is 9:00 AM.
  An agent that converts with today's offset books 9:00 AM (14:00Z) or quotes 8:00 AM slots as 7:00 AM.
  The response_must_match_none patterns catch 7:00/7:30 AM only as an offer (a list item, or a sentence that has or
  makes it available, with no negation), so a refusal that quotes it passes; a dated offer is also
  no_hallucinated_slots (#98).
expect:
  end_state:
    appointments_created: 1
    appointment:
      specialty: physical_therapy
      local_date_between: [2026-11-02, 2026-11-06]
      local_time: "08:00"
      start_utc_time: "13:00"
  trajectory:
    - must_call:
        tool: check_availability
        args_subset:
          date_range: { start_date: 2026-11-02 }
    - must_call_before: [check_availability, book_appointment]
    - must_confirm_before: book_appointment
    - response_must_match_none:
        - '(?:^|[.!?\n])(?![^.!?\n]*(?:\b(?:no|not|nothing|none|outside|closed?|past)\b|n[''’]t\b))[^.!?\n]*(?:\b(?:available|open|openings?|have|has|offer|options?|slots?)\b[^.!?\n]*\b7:[03]0\s*AM|\b7:[03]0\s*AM[^.!?\n]*\b(?:available|open)\b)'
        - '(?:^|\n)[ \t]*(?:[-*•]|\d{1,2}[.)])[ \t]+(?![^\n]*(?:\b(?:no|not|nothing|none|outside|closed?|past)\b|n[''’]t\b))[^\n]*?\b7:[03]0\s*AM'
  invariants: [no_write_without_confirmation, no_hallucinated_slots, times_in_clinic_tz_with_weekday]
  judge: [clarity, no_hallucinated_slots]
