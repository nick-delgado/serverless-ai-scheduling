id: book-provider-not-accepting
category: book
fixture: clinic-default
clock: 2026-10-05T13:00:00Z # Mon Oct 5, 9:00 AM EDT
patient: pat-james
persona: "New to the clinic. A coworker recommended Dr. Brooks."
goal: "Book a general check-up with Dr. Brooks, or whoever is similar if he can't."
hidden_facts:
  reason: "general check-up, new patient"
  fallback: "happy with another family doctor if Dr. Brooks isn't taking new patients"
  timing: "any afternoon in the next two weeks"
max_turns: 12
tags: [provider-facts]
covers: [FR-030, FR-031, FR-035, adr9.no-invented-facts]
notes: >
  prov_brooks has accepting_new_patients=false. The agent should say so from the tool result (not invent a
  rule about why) and offer the other family medicine provider.
expect:
  end_state:
    appointments_created: 1
    appointment:
      specialty: family_medicine
      provider_id: prov_alvarez
  trajectory:
    - must_call: { tool: find_providers }
    - must_call_before: [check_availability, book_appointment]
    - must_confirm_before: book_appointment
  invariants: [no_write_without_confirmation, no_hallucinated_slots, times_in_clinic_tz_with_weekday]
  judge: [tone, clarity, accurate_provider_facts]
