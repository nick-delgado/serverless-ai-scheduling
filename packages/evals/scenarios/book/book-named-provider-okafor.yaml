id: book-named-provider-okafor
category: book
fixture: clinic-default
clock: 2026-10-05T13:00:00Z # Mon Oct 5, 9:00 AM EDT
patient: pat-aisha
persona: "Polite, detail-oriented grad student. Knows exactly which doctor she wants."
goal: "Book with Dr. Okafor for an eczema flare, the earliest morning this week."
hidden_facts:
  reason: "eczema flare on both hands"
  accepts: "any morning Oct 6-9; prefers the earliest one offered"
