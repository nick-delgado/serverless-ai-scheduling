id: book-slot-taken-offers-alternatives
category: book
fixture: clinic-default
clock: 2026-10-05T13:00:00Z # Mon Oct 5, 9:00 AM EDT
patient: pat-aisha
persona: "Calm, a little anxious about heart stuff; wants reassurance the booking actually went through."
goal: "Book a cardiology visit next week in the morning for heart palpitations."
hidden_facts:
  reason: "occasional heart palpitations"
  preference: "picks the first option offered; accepts any other morning next week if that one fails"
setup:
  faults:
    # Another patient takes the chosen slot between check_availability and book_appointment.
    - tool: book_appointment
      call: 1
      error: SLOT_UNAVAILABLE
      effect: slot_taken_by_other_patient
max_turns: 14
tags: [conflict]
covers: [FR-031, FR-035, adr9.confirm-before-write, adr9.no-invented-facts]
expect:
  end_state:
    appointments_created: 1
    appointment:
      specialty: cardiology
      local_date_between: [2026-10-12, 2026-10-16]
      local_time_before: "12:00"
      not_slot: first_failed_book # must not be the slot that was taken
  trajectory:
    - must_call_before: [check_availability, book_appointment]
    - must_confirm_before: book_appointment # the second booking needs its own confirmation
    - max_calls: { book_appointment: 2 }
    - forbid_tools: [escalate_to_human]
  invariants: [no_write_without_confirmation, no_hallucinated_slots, times_in_clinic_tz_with_weekday]
  judge: [tone, clarity, apologizes_for_conflict, no_medical_advice]
