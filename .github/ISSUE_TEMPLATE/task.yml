name: Task
description: A unit of backlog work that one agent can complete in one PR.
title: "[<ID>] <short imperative title>"
labels: ["status:ready"]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What this task achieves and why (one short paragraph). Cite PRD requirement IDs.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Checkable statements. Each one should be verifiable by a command, test, or observation. Cite limits by their contracts constant (`LIMITS.…`), and say what happens for empty, past, conflicting or missing input, or write "agent decides; list in the PR". When the task applies an owner's decision, name each field, table entry and doc line the decision makes stale, or write the same.
      value: |
        - [ ]
    validations:
      required: true
  - type: textarea
    id: owned_paths
    attributes:
      label: Owned paths
      description: Whole files or directories this task may create or modify, never line numbers. Check them against each acceptance criterion and the definition-of-done evidence, such as the runner, CLI or eval wiring that calls the new code. Anything else needs a callout in the PR.
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: Issues that must be closed first ("Blocked by #N"), and what this unblocks.
  - type: textarea
    id: verification
    attributes:
      label: Verification
      description: Commands or steps that prove the acceptance criteria.
  - type: textarea
    id: references
    attributes:
      label: References
      description: ADRs, PRD sections, research notes, external docs.
