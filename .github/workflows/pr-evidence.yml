# Seen-failing evidence (#184, B6-5): a PR that changes a source file carries an `npm run mutate -- … --markdown`
# table with a KILLED row for it. The rule is in scripts/pr-evidence.ts and its tests; this only runs it. A separate workflow
# because it reruns when the PR body is edited, which ci.yml's checks don't need.
# Journal links (#194, B7-3): a journal entry the PR adds names the PR on its Related line (scripts/journal-links.ts).
# It needs the PR's number, so it lives here, and it's red on a PR's first push until the "link PR #N" commit.
name: PR evidence

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

concurrency:
  group: pr-evidence-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  evidence:
    name: Seen-failing evidence
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The body goes through the environment, never into the shell command.
      - run: npx tsx scripts/pr-evidence.ts
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}

  journal-links:
    name: Journal links
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/journal-links.ts
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
