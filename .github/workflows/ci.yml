# sync-start:ci-checks (restated in CLAUDE.md, "How work flows", the CI bullet)
# Every PR and every push to any branch runs the checks agents run locally
# (CLAUDE.md "Definition of done"), plus the changed-line coverage gate (#140),
# which fails any line the branch adds that no test ran, then a report-only duplicate-code
# check on added lines (#184). PRs also run pr-evidence.yml (#184), rerun when the body is
# edited: a changed source file needs a mutate --markdown table in the body. No path filters
# on purpose: required status checks must always report, or docs-only PRs would sit "pending" forever.
# A branch with an open PR gets two runs: the push run on its head, and the PR run
# on its merge with the base. GitHub skips the PR run while the PR has a merge
# conflict, so the push run guarantees every head is tested at least once.
# sync-end:ci-checks
name: CI

on:
  pull_request:
  push:
    branches: ["**"]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  node:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # DynamoDB Local for the repository contract suite on DynamoDB (#13). With CI set, those tests fail
    # instead of skipping when the endpoint is unreachable, so they are part of this required check.
    services:
      dynamodb:
        image: amazon/dynamodb-local:latest
        ports:
          - 8000:8000
    env:
      DYNAMODB_ENDPOINT: http://localhost:8000
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: scripts/adr-history.test.ts diffs the Accepted ADRs against origin/main, and the
          # changed-line coverage gate diffs the branch against its base.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # The whole suite with v8 coverage, then the changed-line gate (#140): every line the PR adds must
      # run in a test, or carry a `v8 ignore` hint with a reason. PR runs diff against the PR's base;
      # push runs leave COVERAGE_BASE empty, so the script uses origin/main.
      - run: npm run test:coverage
      - run: npm run coverage:changed
        env:
          COVERAGE_BASE: ${{ github.event.pull_request.base.sha }}
      # Duplicate code in added lines (#184, B6-6; .jscpd.json). Report-only by owner decision (2026-10-06): calibrated
      # on ten reviewed PRs, it flagged 2 of their 17 duplication findings; the next process batch measures it again.
      - run: npm run dup:changed
        continue-on-error: true
        env:
          DUP_BASE: ${{ github.event.pull_request.base.sha }}

  cfn-lint:
    name: cfn-lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      # Pinned to the version used locally (docs/runbooks/aws-setup.md step 1).
      - run: pip install cfn-lint==1.57.0
      - run: cfn-lint --regions us-east-1 --template 'infra/**/*.yaml'
