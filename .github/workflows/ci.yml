# Every PR and every push to any branch runs the same checks agents run locally
# (CLAUDE.md "Definition of done"). No path filters on purpose: required status
# checks must always report, or docs-only PRs would sit "pending" forever.
# A branch with an open PR gets two runs: the push run on its head, and the PR run
# on its merge with the base. GitHub skips the PR run while the PR has a merge
# conflict, so the push run guarantees every head is tested at least once.
name: CI

on:
  pull_request:
  push:
    branches: ["**"]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  node:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # DynamoDB Local for the repository contract suite on DynamoDB (#13). With CI set, those tests fail
    # instead of skipping when the endpoint is unreachable, so they are part of this required check.
    services:
      dynamodb:
        image: amazon/dynamodb-local:latest
        ports:
          - 8000:8000
    env:
      DYNAMODB_ENDPOINT: http://localhost:8000
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # scripts/adr-history.test.ts diffs the Accepted ADRs against origin/main
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  cfn-lint:
    name: cfn-lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      # Pinned to the version used locally (docs/runbooks/aws-setup.md step 1).
      - run: pip install cfn-lint==1.57.0
      - run: cfn-lint --regions us-east-1 --template 'infra/**/*.yaml'
