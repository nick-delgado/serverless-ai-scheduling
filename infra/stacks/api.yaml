AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >-
  sched-<env>-api: Regional REST API with a Cognito User Pool authorizer and a response-streaming
  Lambda integration for POST /api/chat (ADR-007). The chat function runs the agent loop (S3-03, #17)
  over the single table and Bedrock Converse, and streams NDJSON events. POST /api/session (S3-04, #18)
  returns the templated greeting and the current conversation, read-only, with no model call. The chat
  function may send the escalation email through SES (#35), and an alarm watches failed sends. A
  dashboard shows the chat function's metrics, and X-Ray traces the chat function (#38). Where RequestAccess is
  "on", POST /api/request-access (#357) is the API's one public route: it checks a Cloudflare Turnstile token, then
  creates a temporary synthetic reviewer patient, within a daily cap and an active cap.

Parameters:
  Env:
    Type: String
    Default: dev
    AllowedPattern: "^[a-z][a-z0-9-]{1,15}$"
  PermissionsBoundaryArn:
    Type: AWS::SSM::Parameter::Value<String>
    Default: /sched/bootstrap/permissions-boundary-arn
    Description: Every role in sched-* stacks must carry this boundary (bootstrap stack; ADR-003).
  AgentModelProfile:
    Type: String
    Default: sonnet-4.6
    # The entitled profiles (packages/agent/src/profiles.ts). The chat role may call all of them, so a
    # profile switch and every refusal fallback (REFUSAL_FALLBACKS) need no IAM change (ADR-010).
    AllowedValues: [sonnet-4.6, haiku-4.5, nova-2-lite, nova-pro, gpt-oss-120b, gpt-oss-20b]
    Description: AGENT_MODEL_PROFILE for the chat function.
  DailyTurnCap:
    Type: Number
    Default: 50
    MinValue: 1
    Description: Agent turns per patient per clinic-local day (ADR-009).
  # The env-wide cap (#356). The default is demo's value, so every env is capped unless it overrides:
  # e2e passes 1000 (.github/workflows/e2e.yml), and a live check passes 2.
  EnvDailyTurnCap:
    Type: Number
    Default: 200
    MinValue: 1
    Description: New agent turns the whole env accepts per clinic-local day, across all patients (ADR-009, #356).
  # The escalation email's addresses (#35): the verified SES identity, kept out of this public repo.
  # scripts/deploy.sh passes them from SES_SENDER / SES_STAFF_RECIPIENT (the git-ignored .env). Empty
  # (an ephemeral env without them) leaves the chat function with no SES grant and no notifier.
  SesSender:
    Type: String
    Default: ""
    NoEcho: true
    Description: Verified SES identity that escalation emails are sent from.
  SesStaffRecipient:
    Type: String
    Default: ""
    NoEcho: true
    Description: Front-desk address that receives escalation emails (a verified identity in the SES sandbox).
  # The reviewer access page (#357). On in `demo` (the `Env` clause of RequestAccessOn below, r1/Q-4 (a)) and wherever
  # an env passes `-- RequestAccess=on` (the ephemeral check env); off everywhere else. The expiry job, with its
  # hourly schedule, exists exactly where the page does, so no account is ever issued without something to delete it.
  RequestAccess:
    Type: String
    Default: "off"
    AllowedValues: ["on", "off"]
    Description: >-
      "on" creates POST /api/request-access (the API's one public route), its function and the expiry job. In demo
      the page is on whatever this says. scripts/deploy.sh refuses "on" for dev and e2e, and, wherever the page is on,
      refuses without TURNSTILE_SECRET and TurnstileExpectedHostname. The web stack's build reads the result from
      /sched/<env>/api/request-access (scripts/deploy-web.sh).
  RequestAccessDailyCap:
    Type: Number
    Default: 10
    MinValue: 1
    Description: Temporary accounts issued per clinic-local day (ADR-009, #357). The ephemeral live check passes 2.
  RequestAccessActiveCap:
    Type: Number
    Default: 5
    MinValue: 1
    Description: Temporary accounts in the registry at once (ADR-009, #357). The ephemeral live check passes 2.
  RequestAccessExpiryHours:
    Type: Number
    Default: 24
    MinValue: 1
    Description: Hours before a temporary account is due for deletion (the registry's expiry; the hourly expiry job deletes it, #357).
  # Cloudflare Turnstile's secret key (r1/Q-1 (a)). scripts/deploy.sh passes it from TURNSTILE_SECRET (the
  # git-ignored .env), the way it passes the SES addresses. It reaches the function as an environment variable.
  TurnstileSecret:
    Type: String
    Default: ""
    NoEcho: true
    Description: Cloudflare Turnstile secret key that the request-access function verifies tokens with.
  # The hostname Cloudflare must report for a valid token (the env's CloudFront domain, which the web stack, deployed
  # after this one, creates). Empty skips the check; Cloudflare's test secret keys report "localhost".
  TurnstileExpectedHostname:
    Type: String
    Default: ""
    Description: Hostname a Turnstile token must have been issued on. Empty means not checked.

Conditions:
  SesConfigured: !And
    - !Not [!Equals [!Ref SesSender, ""]]
    - !Not [!Equals [!Ref SesStaffRecipient, ""]]
  # The request page, its function, its route and the expiry job (r1/Q-4 (a)): on in demo, or when RequestAccess is on.
  RequestAccessOn: !Or
    - !Equals [!Ref Env, demo]
    - !Equals [!Ref RequestAccess, "on"]

Globals:
  Function:
    Runtime: nodejs24.x
    Architectures: [arm64]
    MemorySize: 512
    Timeout: 30
    PermissionsBoundary: !Ref PermissionsBoundaryArn
    LoggingConfig:
      LogFormat: JSON
    Environment:
      Variables:
        SCHED_ENV: !Ref Env
    Tags:
      project: sched
      env: !Ref Env
  Api:
    # Without this, SAM also creates a stray stage named "Stage".
    OpenApiVersion: "3.0.1"

Resources:
  # ---------------------------------------------------------------------------------------------
  # POST /api/chat: streaming chat handler (agent loop, #17)
  # ---------------------------------------------------------------------------------------------
  ChatLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/sched-${Env}-api-chat
      RetentionInDays: 14

  ChatFunction:
    Type: AWS::Serverless::Function
    Metadata:
      # SAM's esbuild builder can't resolve npm-workspace packages (@sched/contracts), so the
      # Makefile bundles with esbuild from the repo root instead. WorkingDirectory is relative to
      # this template and lies outside CodeUri, so SAM runs make there rather than in its scratch copy.
      BuildMethod: makefile
      WorkingDirectory: ../..
    Properties:
      FunctionName: !Sub sched-${Env}-api-chat
      Description: POST /api/chat (#17). Runs one agent turn and streams NDJSON ChatStreamEvents.
      CodeUri: ../../services/api
      Handler: index.handler
      MemorySize: 1024
      # X-Ray on this function only (#38, owner decision r1/Q-5 (a)): the Powertools Tracer captures the
      # Bedrock, DynamoDB and SES clients (handlers/chat.ts). The permissions boundary allows the writes.
      Tracing: Active
      # Bounds the whole streamed turn (up to 8 model calls, ADR-001). The handler aborts the agent loop
      # 15 s before this, so it can still store the turn and end the stream with an error event.
      Timeout: 180
      # Reserved concurrency (#273, owner decision r1/Q-2 (c)): 5 of the account's concurrent executions are
      # kept for chat turns in each env, so a burst on another function or env can't starve them, and chat
      # can't run more than 5 turns at once. Each env deployed from this template reserves its own 5; Lambda
      # keeps 100 of the account quota unreserved, so the sum must fit in the quota less 100.
      ReservedConcurrentExecutions: 5
      Environment:
        Variables:
          TABLE_NAME: !Sub "{{resolve:ssm:/sched/${Env}/data/table-name}}"
          AGENT_MODEL_PROFILE: !Ref AgentModelProfile
          DAILY_TURN_CAP: !Ref DailyTurnCap
          ENV_DAILY_TURN_CAP: !Ref EnvDailyTurnCap
          # Read by sesNotifierFromEnv (@sched/tools/ses) in handlers/chat.ts, which passes the notifier
          # to the tools.
          SES_SENDER: !If [SesConfigured, !Ref SesSender, !Ref AWS::NoValue]
          SES_STAFF_RECIPIENT: !If [SesConfigured, !Ref SesStaffRecipient, !Ref AWS::NoValue]
          # No response or error payloads in traces (ADR-009): only IDs and timings leave the function.
          POWERTOOLS_TRACER_CAPTURE_RESPONSE: "false"
          POWERTOOLS_TRACER_CAPTURE_ERROR: "false"
          NODE_OPTIONS: --enable-source-maps
      LoggingConfig:
        LogFormat: JSON
        LogGroup: !Ref ChatLogGroup
      Policies:
        - Version: "2012-10-17"
          Statement:
            # The DynamoDB repositories (#13) and the turn store: item reads, conditional writes, and
            # TransactWriteItems (authorized per item as Put/Update/ConditionCheck). No Scan, no Delete.
            # The base table and its one index, GSI1, by name (#39): a second index needs a change here.
            - Sid: SingleTableItems
              Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:Query
                - dynamodb:PutItem
                - dynamodb:UpdateItem
                - dynamodb:ConditionCheckItem
              Resource:
                - !Sub "{{resolve:ssm:/sched/${Env}/data/table-arn}}"
                - !Sub "{{resolve:ssm:/sched/${Env}/data/table-arn}}/index/GSI1"
            # Every entitled profile (ADR-010) and therefore every refusal fallback. The US cross-region
            # inference profiles route to the foundation model in several US regions, hence `bedrock:*`.
            - Sid: InvokeAgentModels
              Effect: Allow
              Action:
                - bedrock:InvokeModel
                - bedrock:InvokeModelWithResponseStream
              Resource:
                - !Sub arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/us.anthropic.claude-sonnet-4-6
                - !Sub arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/us.anthropic.claude-haiku-4-5-20251001-v1:0
                - !Sub arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/us.amazon.nova-2-lite-v1:0
                - !Sub arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/us.amazon.nova-pro-v1:0
                - !Sub arn:${AWS::Partition}:bedrock:*::foundation-model/anthropic.claude-sonnet-4-6
                - !Sub arn:${AWS::Partition}:bedrock:*::foundation-model/anthropic.claude-haiku-4-5-20251001-v1:0
                - !Sub arn:${AWS::Partition}:bedrock:*::foundation-model/amazon.nova-2-lite-v1:0
                - !Sub arn:${AWS::Partition}:bedrock:*::foundation-model/amazon.nova-pro-v1:0
                # gpt-oss is called by foundation-model ID, in this region only.
                - !Sub arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/openai.gpt-oss-120b-1:0
                - !Sub arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/openai.gpt-oss-20b-1:0
            # The escalation email (#35, ADR-009): SendEmail from the verified identity only. In the SES
            # sandbox the recipient identity is authorized too, so both identities are listed, and the
            # ses:FromAddress condition keeps the recipient identity from being used as a sender.
            - !If
              - SesConfigured
              - Sid: SendEscalationEmail
                Effect: Allow
                Action: ses:SendEmail
                Resource:
                  - !Sub arn:${AWS::Partition}:ses:${AWS::Region}:${AWS::AccountId}:identity/${SesSender}
                  - !Sub arn:${AWS::Partition}:ses:${AWS::Region}:${AWS::AccountId}:identity/${SesStaffRecipient}
                Condition:
                  StringEquals:
                    ses:FromAddress: !Ref SesSender
              - !Ref AWS::NoValue

  # ---------------------------------------------------------------------------------------------
  # Failed staff notifications (#35, #36): one EMF record of Sched/NotificationFailed (ids only) per
  # escalation stored FAILED. The SES notifier writes it for a failed send; handlers/chat.ts writes it for
  # every other FAILED (no notifier, an unreadable record). Shared with #38's dashboard. The runbook's
  # retry section says what to do. No alarm action (#38, owner decision r1/Q-1 (a)): it only changes
  # state, and the dashboard shows that state beside the metric (ADR-003's 2026-10-14 amendment).
  # ---------------------------------------------------------------------------------------------
  NotificationFailedAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub sched-${Env}-notification-failed
      AlarmDescription: >-
        An escalation email to staff failed to send. Re-send it with
        `npx tsx scripts/retry-escalations.ts <env>` (docs/runbooks/aws-setup.md, "Re-sending failed escalation emails").
      Namespace: Sched
      MetricName: NotificationFailed
      Dimensions:
        - Name: Env
          Value: !Ref Env
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  # ---------------------------------------------------------------------------------------------
  # The chat function's dashboard (#38, NFR-007): the per-turn EMF metrics that handlers/chat.ts writes
  # (lib/observability/metrics.ts; namespace Sched, dimension Env), Lambda errors for both functions, and
  # #35's failed-notification metric with its alarm. TTFT and turn latency are NFR-001's figures, timed
  # from the handler's start to the first text_delta and to done.
  # ---------------------------------------------------------------------------------------------
  ApiDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub sched-${Env}-api
      DashboardBody: !Sub |
        {
          "widgets": [
            {
              "type": "metric", "x": 0, "y": 0, "width": 12, "height": 6,
              "properties": {
                "title": "Time to first text_delta (ms, NFR-001: p50 <= 3000)",
                "region": "${AWS::Region}", "view": "timeSeries", "period": 300,
                "metrics": [
                  ["Sched", "TimeToFirstTextMs", "Env", "${Env}", {"stat": "p50", "label": "p50"}],
                  ["Sched", "TimeToFirstTextMs", "Env", "${Env}", {"stat": "p95", "label": "p95"}]
                ]
              }
            },
            {
              "type": "metric", "x": 12, "y": 0, "width": 12, "height": 6,
              "properties": {
                "title": "Turn latency to done (ms, NFR-001: p95 <= 15000)",
                "region": "${AWS::Region}", "view": "timeSeries", "period": 300,
                "metrics": [
                  ["Sched", "TurnLatencyMs", "Env", "${Env}", {"stat": "p50", "label": "p50"}],
                  ["Sched", "TurnLatencyMs", "Env", "${Env}", {"stat": "p95", "label": "p95"}]
                ]
              }
            },
            {
              "type": "metric", "x": 0, "y": 6, "width": 12, "height": 6,
              "properties": {
                "title": "Tokens per period",
                "region": "${AWS::Region}", "view": "timeSeries", "stat": "Sum", "period": 300,
                "metrics": [
                  ["Sched", "InputTokens", "Env", "${Env}"],
                  ["Sched", "OutputTokens", "Env", "${Env}"],
                  ["Sched", "CacheReadTokens", "Env", "${Env}"],
                  ["Sched", "CacheWriteTokens", "Env", "${Env}"]
                ]
              }
            },
            {
              "type": "metric", "x": 12, "y": 6, "width": 12, "height": 6,
              "properties": {
                "title": "Turns, turn errors by code, Lambda errors",
                "region": "${AWS::Region}", "view": "timeSeries", "stat": "Sum", "period": 300,
                "metrics": [
                  ["Sched", "Turns", "Env", "${Env}"],
                  ["Sched", "TurnErrors", "Env", "${Env}", "ErrorCode", "BAD_REQUEST"],
                  ["Sched", "TurnErrors", "Env", "${Env}", "ErrorCode", "UNAUTHORIZED"],
                  ["Sched", "TurnErrors", "Env", "${Env}", "ErrorCode", "RATE_LIMITED"],
                  ["Sched", "TurnErrors", "Env", "${Env}", "ErrorCode", "AGENT_UNAVAILABLE"],
                  ["Sched", "TurnErrors", "Env", "${Env}", "ErrorCode", "INTERNAL"],
                  ["AWS/Lambda", "Errors", "FunctionName", "${ChatFunction}", {"label": "Lambda errors (chat)"}],
                  ["AWS/Lambda", "Errors", "FunctionName", "${SessionFunction}", {"label": "Lambda errors (session)"}]
                ]
              }
            },
            {
              "type": "metric", "x": 0, "y": 12, "width": 8, "height": 6,
              "properties": {
                "title": "Tool error rate (%)",
                "region": "${AWS::Region}", "view": "timeSeries", "stat": "Sum", "period": 300,
                "metrics": [
                  [{"expression": "100 * errors / calls", "label": "ToolErrors / ToolCalls", "id": "rate"}],
                  ["Sched", "ToolCalls", "Env", "${Env}", {"id": "calls", "visible": false}],
                  ["Sched", "ToolErrors", "Env", "${Env}", {"id": "errors", "visible": false}]
                ]
              }
            },
            {
              "type": "metric", "x": 8, "y": 12, "width": 8, "height": 6,
              "properties": {
                "title": "Failed staff notifications",
                "region": "${AWS::Region}", "view": "timeSeries", "stat": "Sum", "period": 300,
                "metrics": [["Sched", "NotificationFailed", "Env", "${Env}"]]
              }
            },
            {
              "type": "alarm", "x": 16, "y": 12, "width": 8, "height": 3,
              "properties": {
                "title": "Failed-notification alarm (no action: watch it here)",
                "alarms": ["${NotificationFailedAlarm.Arn}"]
              }
            },
            {
              "type": "metric", "x": 16, "y": 15, "width": 8, "height": 3,
              "properties": {
                "title": "Booking conflict retries",
                "region": "${AWS::Region}", "view": "singleValue", "stat": "Sum", "period": 86400,
                "metrics": [["Sched", "BookingConflictRetries", "Env", "${Env}"]]
              }
            }
          ]
        }

  # ---------------------------------------------------------------------------------------------
  # POST /api/session: templated greeting + conversation restore (#18). Read-only, no Bedrock.
  # ---------------------------------------------------------------------------------------------
  SessionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/sched-${Env}-api-session
      RetentionInDays: 14

  SessionFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
      WorkingDirectory: ../..
    Properties:
      FunctionName: !Sub sched-${Env}-api-session
      Description: POST /api/session (#18). Templated greeting and the current conversation, as JSON.
      CodeUri: ../../services/api
      Handler: index.handler
      Timeout: 10
      Environment:
        Variables:
          TABLE_NAME: !Sub "{{resolve:ssm:/sched/${Env}/data/table-name}}"
          NODE_OPTIONS: --enable-source-maps
      LoggingConfig:
        LogFormat: JSON
        LogGroup: !Ref SessionLogGroup
      Policies:
        - Version: "2012-10-17"
          Statement:
            # Exactly the reads it makes, all on the base table: GetItem for the profile and the
            # provider; Query for the patient's appointments, conversations and one conversation's messages.
            - Sid: SessionReads
              Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:Query
              Resource:
                - !Sub "{{resolve:ssm:/sched/${Env}/data/table-arn}}"

  # ---------------------------------------------------------------------------------------------
  # POST /api/request-access: the one public route (#357). Only where RequestAccess is "on".
  # No authorizer: the bot check and the two caps are its gates, and the stage throttle covers it. It grants only
  # what it calls: the two item writes of its transactions on the base table (no read, no delete, no index) and
  # four Cognito admin calls on this env's pool. The permissions boundary (bootstrap.yaml) lists the same actions.
  # ---------------------------------------------------------------------------------------------
  RequestAccessLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: RequestAccessOn
    Properties:
      LogGroupName: !Sub /aws/lambda/sched-${Env}-api-request-access
      RetentionInDays: 14

  RequestAccessFunction:
    Type: AWS::Serverless::Function
    Condition: RequestAccessOn
    Metadata:
      BuildMethod: makefile
      WorkingDirectory: ../..
    Properties:
      FunctionName: !Sub sched-${Env}-api-request-access
      Description: POST /api/request-access (#357). Bot check, then a temporary synthetic patient with its sign-in details, once.
      CodeUri: ../../services/api
      Handler: index.handler
      Timeout: 20
      Environment:
        Variables:
          TABLE_NAME: !Sub "{{resolve:ssm:/sched/${Env}/data/table-name}}"
          USER_POOL_ID: !Sub "{{resolve:ssm:/sched/${Env}/auth/user-pool-id}}"
          TURNSTILE_SECRET: !Ref TurnstileSecret
          TURNSTILE_EXPECTED_HOSTNAME: !Ref TurnstileExpectedHostname
          ACCESS_DAILY_CAP: !Ref RequestAccessDailyCap
          ACCESS_ACTIVE_CAP: !Ref RequestAccessActiveCap
          ACCESS_EXPIRY_HOURS: !Ref RequestAccessExpiryHours
          NODE_OPTIONS: --enable-source-maps
      LoggingConfig:
        LogFormat: JSON
        LogGroup: !Ref RequestAccessLogGroup
      Policies:
        - Version: "2012-10-17"
          Statement:
            # Its transactions write items: Put (the registry entry, the profile) and Update (the counters, the
            # entry's sub). Nothing is read, deleted or queried here.
            - Sid: RegistryAndProfileWrites
              Effect: Allow
              Action:
                - dynamodb:PutItem
                - dynamodb:UpdateItem
              Resource:
                - !Sub "{{resolve:ssm:/sched/${Env}/data/table-arn}}"
            - Sid: CreateAndDeleteTemporaryUsers
              Effect: Allow
              Action:
                - cognito-idp:AdminCreateUser
                - cognito-idp:AdminSetUserPassword
                - cognito-idp:AdminGetUser
                - cognito-idp:AdminDeleteUser
              Resource:
                - !Sub "{{resolve:ssm:/sched/${Env}/auth/user-pool-arn}}"

  RequestAccessApiInvokePermission:
    Type: AWS::Lambda::Permission
    Condition: RequestAccessOn
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !GetAtt RequestAccessFunction.Arn
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${ChatApi}/*/POST/api/request-access

  # ---------------------------------------------------------------------------------------------
  # The expiry job (#357, part 2): deletes each temporary account that is due, with its data, every hour. It exists
  # exactly where the request function does. No API route: a SAM `Schedule` event invokes it, and an operator may too
  # (`{ "asOf": "<ISO time>" }`, the runbook's revoke-all step). It grants only what it calls: the registry query, item
  # reads, deletes and the two transactions' updates on the base table (no BatchWriteItem, no index) and three Cognito
  # admin calls on this env's pool. The permissions boundary (bootstrap.yaml) lists the same actions.
  # ---------------------------------------------------------------------------------------------
  RequestAccessExpiryLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: RequestAccessOn
    Properties:
      LogGroupName: !Sub /aws/lambda/sched-${Env}-api-request-access-expiry
      RetentionInDays: 14

  RequestAccessExpiryFunction:
    Type: AWS::Serverless::Function
    Condition: RequestAccessOn
    Metadata:
      BuildMethod: makefile
      WorkingDirectory: ../..
    Properties:
      FunctionName: !Sub sched-${Env}-api-request-access-expiry
      Description: Hourly (#357). Deletes expired temporary reviewer accounts, their data, and frees their slots and registry places.
      CodeUri: ../../services/api
      Handler: index.handler
      Timeout: 300
      Environment:
        Variables:
          TABLE_NAME: !Sub "{{resolve:ssm:/sched/${Env}/data/table-name}}"
          USER_POOL_ID: !Sub "{{resolve:ssm:/sched/${Env}/auth/user-pool-id}}"
          NODE_OPTIONS: --enable-source-maps
      LoggingConfig:
        LogFormat: JSON
        LogGroup: !Ref RequestAccessExpiryLogGroup
      Events:
        Hourly:
          Type: Schedule
          Properties:
            Schedule: rate(1 hour)
            Description: Run the reviewer-account expiry job (#357).
      Policies:
        - Version: "2012-10-17"
          Statement:
            # Query (the registry, each partition of an account), GetItem (an appointment, read again before its slot is
            # released), DeleteItem (every item), UpdateItem (the slot's release and the active counter's decrement, in
            # transactions with a delete). Nothing is put and nothing is scanned.
            - Sid: RegistryAndAccountData
              Effect: Allow
              Action:
                - dynamodb:Query
                - dynamodb:GetItem
                - dynamodb:DeleteItem
                - dynamodb:UpdateItem
              Resource:
                - !Sub "{{resolve:ssm:/sched/${Env}/data/table-arn}}"
            - Sid: DeleteTemporaryUsers
              Effect: Allow
              Action:
                - cognito-idp:AdminGetUser
                - cognito-idp:AdminUserGlobalSignOut
                - cognito-idp:AdminDeleteUser
              Resource:
                - !Sub "{{resolve:ssm:/sched/${Env}/auth/user-pool-arn}}"

  ChatApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub sched-${Env}-api
      StageName: live
      EndpointConfiguration:
        Type: REGIONAL
      # Stage throttle (#273): one setting for every method of this env's stage ("/*" "*"), which API Gateway
      # applies per method, so each method has its own bucket, shared by every client. It bounds the sustained
      # request rate (5 a second, burst 10), best effort. It doesn't bound a simultaneous warm burst (30 of 30
      # passed, docs/research/security-review.md §3), Bedrock requests (an account-wide per-model quota,
      # profiles.ts `rpm`; a turn makes up to 8 model calls), Lambda concurrency (only ChatFunction is capped,
      # at its reservation of 5; SessionFunction has no cap), or one patient's use (DailyTurnCap does).
      MethodSettings:
        - ResourcePath: "/*"
          HttpMethod: "*"
          ThrottlingRateLimit: 5
          ThrottlingBurstLimit: 10
      Tags:
        project: sched
        env: !Ref Env
      # Response streaming isn't a first-class SAM property, so the API is defined in OpenAPI.
      DefinitionBody:
        openapi: "3.0.1"
        info:
          title: !Sub sched-${Env}-api
          version: "1"
        paths:
          /api/chat:
            post:
              summary: Send a chat message; the reply streams back as NDJSON ChatStreamEvents.
              security:
                - CognitoUserPool: []
              x-amazon-apigateway-integration:
                type: aws_proxy
                httpMethod: POST
                uri: !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2021-11-15/functions/${ChatFunction.Arn}/response-streaming-invocations
                responseTransferMode: STREAM
                # Streaming integrations may run up to 15 minutes; an agent turn needs well under 5.
                timeoutInMillis: 300000
          /api/session:
            post:
              summary: Templated greeting and the current conversation (SessionResponse). Body empty or {}.
              security:
                - CognitoUserPool: []
              x-amazon-apigateway-integration:
                type: aws_proxy
                httpMethod: POST
                uri: !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${SessionFunction.Arn}/invocations
                timeoutInMillis: 10000
          # The API's one public method (#357): no `security`, so API Gateway runs no authorizer. Only where the page is on.
          /api/request-access: !If
            - RequestAccessOn
            - post:
                summary: Request a temporary demo patient (RequestAccessResponse). Body is a Turnstile token.
                x-amazon-apigateway-integration:
                  type: aws_proxy
                  httpMethod: POST
                  uri: !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${RequestAccessFunction.Arn}/invocations
                  timeoutInMillis: 20000
            - !Ref AWS::NoValue
        components:
          securitySchemes:
            # No OAuth scopes on the method, so the authorizer validates the Cognito *ID* token.
            CognitoUserPool:
              type: apiKey
              name: Authorization
              in: header
              x-amazon-apigateway-authtype: cognito_user_pools
              x-amazon-apigateway-authorizer:
                type: cognito_user_pools
                providerARNs:
                  # Resolved from the auth stack's SSM output for *this* Env (see sam-deploy skill).
                  - !Sub "{{resolve:ssm:/sched/${Env}/auth/user-pool-arn}}"

  ChatApiInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !GetAtt ChatFunction.Arn
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${ChatApi}/*/POST/api/chat

  SessionApiInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !GetAtt SessionFunction.Arn
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${ChatApi}/*/POST/api/session

  # ---------------------------------------------------------------------------------------------
  # Outputs for the web stack and scripts (/sched/<env>/api/...)
  # ---------------------------------------------------------------------------------------------
  StatusParam:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /sched/${Env}/api/status
      Type: String
      Value: agent

  RestApiIdParam:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /sched/${Env}/api/rest-api-id
      Type: String
      Value: !Ref ChatApi

  ExecuteApiDomainParam:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /sched/${Env}/api/execute-api-domain
      Type: String
      Value: !Sub ${ChatApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}

  StageNameParam:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /sched/${Env}/api/stage-name
      Type: String
      Value: !Ref ChatApi.Stage

  # Whether the request page is on (#357, r1/Q-4 (a)). scripts/deploy-web.sh reads it to set VITE_REQUEST_ACCESS.
  RequestAccessParam:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /sched/${Env}/api/request-access
      Type: String
      Value: !If [RequestAccessOn, "on", "off"]

Outputs:
  RestApiId:
    Value: !Ref ChatApi
  StageName:
    Value: !GetAtt StageNameParam.Value
  ChatUrl:
    Description: Direct execute-api URL (the SPA goes through CloudFront at /api/chat instead).
    Value: !Sub https://${ChatApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/${StageNameParam.Value}/api/chat
  ChatFunctionName:
    Value: !Ref ChatFunction
  SessionUrl:
    Description: Direct execute-api URL (the SPA goes through CloudFront at /api/session instead).
    Value: !Sub https://${ChatApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/${StageNameParam.Value}/api/session
  SessionFunctionName:
    Value: !Ref SessionFunction
  NotificationFailedAlarmName:
    Value: !Ref NotificationFailedAlarm
  DashboardName:
    Value: !Ref ApiDashboard
