AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  sched-bootstrap — one-time, admin-deployed foundation for the AI scheduling assistant.
  Creates the CloudFormation execution role (and the permissions boundary every
  workload role must carry), the SAM artifact bucket, a monthly budget alarm and a
  Bedrock budget alarm, GitHub's OIDC provider with one short-lived role per
  CI workflow (deploy, eval gate, E2E), and, once DemoTranscribeRoleName is set,
  the demo spend backstop (a Transcribe budget whose 100% action denies voice to
  demo's Identity Pool role).
  See docs/runbooks/aws-setup.md and docs/adr/0003-iac-layout.md.

Parameters:
  BudgetLimitUsd:
    Type: Number
    Default: 25
    MinValue: 1
    Description: Monthly cost budget (USD) for the whole account; alerts at 80% actual and 100% forecast.
  BudgetAlertEmail:
    Type: String
    AllowedPattern: "^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$"
    Description: Email address that receives budget alerts.
  BedrockBudgetLimitUsd:
    Type: Number
    Default: 10
    MinValue: 1
    Description: Monthly Amazon Bedrock budget (USD), mostly the CI eval gate; alerts at 80% actual and 100% forecast.
  BedrockBudgetServices:
    Type: CommaDelimitedList
    Default: Amazon Bedrock
    Description: >-
      The Cost Explorer service names the Bedrock budget counts. Read the names past Claude spend appears under in
      Cost Explorer (group by Service) and pass them on the first apply (runbook, "CI credentials", step 1).
  DemoBackstopUsd:
    Type: Number
    Default: 10
    MinValue: 1
    Description: >-
      Monthly Amazon Transcribe budget (USD) behind the demo spend backstop (#356): an email at 80% actual, and at
      100% actual an action that attaches a deny policy to demo's Identity Pool role. Only used when
      DemoTranscribeRoleName is set.
  DemoBackstopServices:
    Type: CommaDelimitedList
    Default: Transcribe
    Description: >-
      The Cost Explorer service names the backstop budget counts ("Transcribe", as Nick read it in Cost Explorer's
      Service grouping on 2026-10-20). Account-wide, since Transcribe spend can't be
      attributed to demo; valid only while no CI or eval job calls Transcribe.
  DemoTranscribeRoleName:
    Type: String
    Default: ""
    AllowedPattern: '^$|^[\w+=,.@-]{1,64}$'
    Description: >-
      The name of demo's Identity Pool role (the physical name of the auth stack's TranscribeBrowserRole). Empty
      creates no backstop. Read it with the runbook's command, and re-apply when demo's auth stack replaces the role.

Conditions:
  HasDemoBackstop: !Not [!Equals [!Ref DemoTranscribeRoleName, ""]]

Resources:
  # ---------------------------------------------------------------------------
  # Permissions boundary: the ceiling for every IAM role created by sched-* stacks
  # (Lambda roles, Identity Pool role, ...). Even if a template asks for more,
  # the effective permissions can never exceed this. WorkloadServices lists only what a sched-*
  # workload role grants today (#270): SAM's log and X-Ray writes, the chat role's DynamoDB item
  # actions, the two Bedrock invokes and SendEmail, and the Identity Pool role's Transcribe call.
  # Reviewer access (#357) adds the request function's four Cognito admin calls, the expiry job's
  # sign-out, and DeleteItem for the job (the job is the second part of #357, unused until it lands).
  # A role that needs another action needs a line here first.
  # ---------------------------------------------------------------------------
  WorkloadPermissionsBoundary:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: sched-permissions-boundary
      Description: Maximum permissions for roles created by sched-* stacks.
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: WorkloadServices
            Effect: Allow
            Action:
              - logs:CreateLogGroup
              - logs:CreateLogStream
              - logs:PutLogEvents
              - xray:PutTraceSegments
              - xray:PutTelemetryRecords
              - dynamodb:GetItem
              - dynamodb:PutItem
              - dynamodb:UpdateItem
              - dynamodb:Query
              - dynamodb:ConditionCheckItem
              - bedrock:InvokeModel
              - bedrock:InvokeModelWithResponseStream
              - ses:SendEmail
              - transcribe:StartStreamTranscriptionWebSocket
              - cognito-idp:AdminCreateUser
              - cognito-idp:AdminSetUserPassword
              - cognito-idp:AdminGetUser
              - cognito-idp:AdminDeleteUser
              - cognito-idp:AdminUserGlobalSignOut
              - dynamodb:DeleteItem
            Resource: "*"
          - Sid: NeverIamOrAccountLevel
            Effect: Deny
            Action:
              - iam:*
              - organizations:*
              - account:*
              - sso:*
            Resource: "*"

  # ---------------------------------------------------------------------------
  # CloudFormation execution role. Agents deploy with the SchedDeployer SSO
  # permission set, which may only drive CloudFormation and PassRole *this* role.
  # ---------------------------------------------------------------------------
  CfnExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: sched-cfn-exec
      Description: Assumed by CloudFormation to create sched-* stack resources.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudformation.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: sched-cfn-exec
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # One statement per service (#270 F-3, r1/Q-2 (a)): the actions stay service-wide, the resources are
              # named where the ARN carries the sched- name. No stack declares an X-Ray or SES resource (the expiry job's schedule, #357, is the one Events rule, granted below), and
              # none a Bedrock one, so those grants are gone. Where a statement below holds no sched- name, its
              # comment says why. An action that takes no resource gets its own "*" statement once a deploy shows
              # the AccessDenied.
              - Sid: DynamoDbSchedTables
                Effect: Allow
                Action: dynamodb:*
                Resource:
                  - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/sched-*
                  - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/sched-*/index/*
              - Sid: LambdaSchedFunctions
                Effect: Allow
                Action: lambda:*
                Resource: !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:sched-*
              - Sid: LogsSchedLambdaLogGroups
                Effect: Allow
                Action: logs:*
                Resource: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/sched-*
              # The SAM Schedule event of the expiry job (#357, second part) creates an EventBridge rule named
              # from the stack, so it starts with sched-. The five actions are the ones a rule and its target need.
              - Sid: EventsSchedRules
                Effect: Allow
                Action:
                  - events:PutRule
                  - events:PutTargets
                  - events:DescribeRule
                  - events:DeleteRule
                  - events:RemoveTargets
                Resource: !Sub arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:rule/sched-*
              # A dashboard's ARN has no region.
              - Sid: CloudWatchSchedAlarmsAndDashboards
                Effect: Allow
                Action: cloudwatch:*
                Resource:
                  - !Sub arn:${AWS::Partition}:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:sched-*
                  - !Sub arn:${AWS::Partition}:cloudwatch::${AWS::AccountId}:dashboard/sched-*
              # The web and artifact buckets are both sched-* (the artifact bucket is read for templates and code).
              - Sid: S3SchedBuckets
                Effect: Allow
                Action: s3:*
                Resource:
                  - !Sub arn:${AWS::Partition}:s3:::sched-*
                  - !Sub arn:${AWS::Partition}:s3:::sched-*/*
              # Parameter names start with /sched/, so the ARN is parameter/sched/..., not parameter/sched-*.
              - Sid: SsmSchedParameters
                Effect: Allow
                Action: ssm:*
                Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/sched/*
              # A distribution and an origin access control are named by a generated ID, so no ARN can carry the
              # sched- name. That is the reason this stays "*".
              - Sid: CloudFrontDistributionsAndOacs
                Effect: Allow
                Action: cloudfront:*
                Resource: "*"
              # A REST API, its stages and deployments are named by a generated ID (the sched- name is a property),
              # so no ARN can carry the sched- name. That is the reason this stays "*".
              - Sid: ApiGatewayApis
                Effect: Allow
                Action: apigateway:*
                Resource: "*"
              # CreateUserPool takes no resource, and a pool's ID is generated, so the name can't be in the ARN.
              - Sid: CognitoUserPools
                Effect: Allow
                Action: cognito-idp:*
                Resource: "*"
              # CreateIdentityPool takes no resource, and a pool's ID is generated, so the name can't be in the ARN.
              - Sid: CognitoIdentityPools
                Effect: Allow
                Action: cognito-identity:*
                Resource: "*"
              # With --role-arn, CloudFormation expands the SAM transform as this role (found in #6).
              - Sid: ExpandSamTransform
                Effect: Allow
                Action: cloudformation:CreateChangeSet
                Resource: !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:aws:transform/Serverless-2016-10-31
              - Sid: CreateWorkloadRolesOnlyWithBoundary
                Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:PutRolePolicy
                  - iam:AttachRolePolicy
                  - iam:PutRolePermissionsBoundary
                Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/sched-*
                Condition:
                  StringEquals:
                    iam:PermissionsBoundary: !Ref WorkloadPermissionsBoundary
              - Sid: ManageWorkloadRoles
                Effect: Allow
                Action:
                  - iam:GetRole
                  - iam:GetRolePolicy
                  - iam:ListRolePolicies
                  - iam:ListAttachedRolePolicies
                  - iam:DeleteRole
                  - iam:DeleteRolePolicy
                  - iam:DetachRolePolicy
                  - iam:TagRole
                  - iam:UntagRole
                  - iam:UpdateRole
                  - iam:UpdateRoleDescription
                  - iam:UpdateAssumeRolePolicy
                  - iam:PassRole
                Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/sched-*
              # The CI roles below and the demo backstop's execution role (sched-budgets-action) are sched-* roles
              # too, so ManageWorkloadRoles would otherwise let a stack rewrite their trust (UpdateAssumeRolePolicy)
              # or delete them.
              - Sid: ProtectBootstrapIdentities
                Effect: Deny
                Action: iam:*
                Resource:
                  - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/sched-cfn-exec
                  - !Ref WorkloadPermissionsBoundary
                  - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/sched-github-deploy
                  - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/sched-github-evals
                  - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/sched-github-e2e
                  - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/sched-budgets-action
                  - !Ref GitHubOidcProvider
              - Sid: NoBoundaryRemoval
                Effect: Deny
                Action: iam:DeleteRolePermissionsBoundary
                Resource: "*"

  # ---------------------------------------------------------------------------
  # SAM / CloudFormation artifact bucket
  # ---------------------------------------------------------------------------
  ArtifactBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub sched-artifacts-${AWS::AccountId}-${AWS::Region}
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      LifecycleConfiguration:
        Rules:
          - Id: ExpireOldArtifacts
            Status: Enabled
            ExpirationInDays: 30

  ArtifactBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ArtifactBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !GetAtt ArtifactBucket.Arn
              - !Sub ${ArtifactBucket.Arn}/*
            Condition:
              Bool:
                aws:SecureTransport: "false"

  # ---------------------------------------------------------------------------
  # Cost guardrail
  # ---------------------------------------------------------------------------
  MonthlyBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: sched-monthly
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: !Ref BudgetLimitUsd
          Unit: USD
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 80
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref BudgetAlertEmail
        - Notification:
            NotificationType: FORECASTED
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref BudgetAlertEmail

  # Amazon Bedrock spend, which the CI eval gate (#34) adds on every PR that changes the agent. The gate keeps
  # its own --max-cost per run; this alert catches the sum.
  BedrockBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: sched-bedrock-monthly
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: !Ref BedrockBudgetLimitUsd
          Unit: USD
        CostFilters:
          Service: !Ref BedrockBudgetServices
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 80
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref BudgetAlertEmail
        - Notification:
            NotificationType: FORECASTED
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref BudgetAlertEmail

  # ---------------------------------------------------------------------------
  # Demo spend backstop (#356, ADR-009's second 2026-10-20 amendment). One monthly COST budget on Amazon Transcribe,
  # and at 100% of ACTUAL spend, with no approval step, an action that attaches a deny policy to demo's Identity
  # Pool role. Budgets data lags by hours, so the action runs some time after the threshold is crossed. Nothing here
  # is created while DemoTranscribeRoleName is empty.
  #
  # Transcribe only (r1/Q-6 (b)): the budget counts the account's Transcribe spend, because nothing attributes
  # Transcribe to demo, and no CI or eval job calls it. Bedrock is left out: its cross-region inference profile
  # can't carry a cost allocation tag, an application inference profile would change the model ID the agent
  # calls, and Budgets documents no IAM-principal filter. Nick decided not to automate it (#356, comment of
  # 2026-10-20): he stops demo's Bedrock spend by hand (runbook, "Stopping demo's spend by hand").
  #
  # The deny policy and the execution role name no role but demo's. The execution role can attach and detach
  # only this policy, on only that role.
  # ---------------------------------------------------------------------------
  DemoBackstopDenyPolicy:
    Type: AWS::IAM::ManagedPolicy
    Condition: HasDemoBackstop
    Properties:
      ManagedPolicyName: sched-demo-backstop-deny
      Description: Attached by the demo spend backstop (#356); denies a Transcribe streaming connection.
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyTranscribeStreaming
            Effect: Deny
            Action:
              - transcribe:StartStreamTranscriptionWebSocket
            Resource: "*"

  DemoBackstopExecutionRole:
    Type: AWS::IAM::Role
    Condition: HasDemoBackstop
    Properties:
      RoleName: sched-budgets-action
      Description: Assumed by AWS Budgets to attach and detach the demo backstop's deny policy on demo's Identity Pool role.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: budgets.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnLike:
                aws:SourceArn: !Sub arn:${AWS::Partition}:budgets::${AWS::AccountId}:budget/*
      Policies:
        - PolicyName: attach-the-backstop-policy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: AttachAndDetachTheDenyPolicy
                Effect: Allow
                Action:
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${DemoTranscribeRoleName}
                Condition:
                  ArnEquals:
                    iam:PolicyARN: !Ref DemoBackstopDenyPolicy

  DemoBackstopBudget:
    Type: AWS::Budgets::Budget
    Condition: HasDemoBackstop
    Properties:
      Budget:
        BudgetName: sched-demo-backstop
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: !Ref DemoBackstopUsd
          Unit: USD
        CostFilters:
          Service: !Ref DemoBackstopServices
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 80
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref BudgetAlertEmail

  DemoBackstopAction:
    Type: AWS::Budgets::BudgetsAction
    Condition: HasDemoBackstop
    Properties:
      BudgetName: !Ref DemoBackstopBudget
      ActionType: APPLY_IAM_POLICY
      ApprovalModel: AUTOMATIC
      NotificationType: ACTUAL
      ActionThreshold:
        Type: PERCENTAGE
        Value: 100
      ExecutionRoleArn: !GetAtt DemoBackstopExecutionRole.Arn
      Definition:
        IamActionDefinition:
          PolicyArn: !Ref DemoBackstopDenyPolicy
          Roles:
            - !Ref DemoTranscribeRoleName
      Subscribers:
        - Type: EMAIL
          Address: !Ref BudgetAlertEmail

  # ---------------------------------------------------------------------------
  # CI credentials (#41): GitHub's OIDC provider and one role per workflow, each with its own grants, so no
  # workflow gets the union of the three. The roles carry no permissions boundary: the deploy and E2E roles
  # need iam:PassRole on sched-cfn-exec, which the boundary denies (sched-cfn-exec has none either).
  # ProtectBootstrapIdentities (above) keeps sched-cfn-exec, and so every stack, off them.
  #
  # Trust: every subject uses the repository's immutable form (owner and repository IDs) with the subject
  # customization the runbook sets (claim keys repo, context, job_workflow_ref), so a renamed or recreated
  # repository can't match. The format was confirmed from a probe workflow's tokens before the first apply
  # (journal, 2026-10-08); each workflow's first run confirms its own string (runbook, "CI credentials (GitHub
  # OIDC)"). scripts/bootstrap-template.test.ts pins them.
  # ---------------------------------------------------------------------------
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com

  # .github/workflows/deploy.yml: workflow_dispatch from main, in the `dev` GitHub Environment, deploys dev
  # with scripts/deploy.sh and scripts/deploy-web.sh (r1/Q-1, r1/A-4).
  GitHubDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: sched-github-deploy
      Description: GitHub Actions deploy workflow (deploy.yml, dev environment, main) deploys dev.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GitHubOidcProvider
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: "repo:nick-delgado@25354284/serverless-ai-scheduling@1391507382:environment:dev:job_workflow_ref:nick-delgado/serverless-ai-scheduling/.github/workflows/deploy.yml@refs/heads/main"
      Policies:
        # Copied from infra/bootstrap/sched-deployer-policy.json (the statements the two scripts use), narrowed
        # to dev and without DeleteStack, drift, debugging, seeding, Bedrock or SES. Keep in sync with it and with
        # GitHubE2eRole's copy below (the same statements for e2e, plus seeding). DescribeStacks differs: here it
        # is in the stack-scoped statement, while SchedDeployer keeps it on "*" for the runbook's unnamed listing
        # (F-22, #270).
        - PolicyName: sched-github-deploy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: Identity
                Effect: Allow
                Action: sts:GetCallerIdentity
                Resource: "*"
              - Sid: CloudFormationReadAndValidate
                Effect: Allow
                Action:
                  - cloudformation:ValidateTemplate
                  - cloudformation:GetTemplateSummary
                  - cloudformation:ListStacks
                  - cloudformation:ListExports
                Resource: "*"
              - Sid: CloudFormationDriveDevStacks
                Effect: Allow
                Action:
                  - cloudformation:CreateStack
                  - cloudformation:UpdateStack
                  - cloudformation:CreateChangeSet
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:DeleteChangeSet
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeChangeSet
                  - cloudformation:ListChangeSets
                  - cloudformation:DescribeStackEvents
                  - cloudformation:DescribeStackResource
                  - cloudformation:DescribeStackResources
                  - cloudformation:ListStackResources
                  - cloudformation:GetTemplate
                  - cloudformation:TagResource
                Resource: !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/sched-dev-*/*
              - Sid: SamTransform
                Effect: Allow
                Action: cloudformation:CreateChangeSet
                Resource: !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:aws:transform/Serverless-2016-10-31
              - Sid: PassOnlyTheCfnExecutionRole
                Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt CfnExecutionRole.Arn
                Condition:
                  StringEquals:
                    iam:PassedToService: cloudformation.amazonaws.com
              - Sid: ArtifactAndDevSiteBuckets
                Effect: Allow
                Action:
                  - s3:ListBucket
                  - s3:GetBucketLocation
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                Resource:
                  - !GetAtt ArtifactBucket.Arn
                  - !Sub ${ArtifactBucket.Arn}/sched-dev-*
                  - !Sub arn:${AWS::Partition}:s3:::sched-dev-web-*
                  - !Sub arn:${AWS::Partition}:s3:::sched-dev-web-*/*
              # Distribution IDs are random, so this is every distribution in the account (other envs' too);
              # invalidation only.
              - Sid: SpaInvalidation
                Effect: Allow
                Action:
                  - cloudfront:CreateInvalidation
                  - cloudfront:GetInvalidation
                Resource: !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/*
              - Sid: SsmBootstrapAndDevParameters
                Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters
                  - ssm:GetParametersByPath
                Resource:
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/sched/bootstrap/*
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/sched/dev/*

  # .github/workflows/evals.yml (#34): the CI eval gate on same-repository pull requests. Only the pull request
  # number is wildcarded (r1/A-5). Bedrock only, on the development-default profile and the default judge:
  # sonnet-4.6 (agent, simulator, refusal fallback) and haiku-4.5 (judge). If #37 changes the default, this
  # role needs a bootstrap change.
  GitHubEvalsRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: sched-github-evals
      Description: GitHub Actions CI eval gate (evals.yml, pull requests) calls Bedrock on the eval profiles.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GitHubOidcProvider
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub: "repo:nick-delgado@25354284/serverless-ai-scheduling@1391507382:pull_request:job_workflow_ref:nick-delgado/serverless-ai-scheduling/.github/workflows/evals.yml@refs/pull/*/merge"
      Policies:
        - PolicyName: sched-github-evals
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # Copied from infra/stacks/api.yaml (InvokeAgentModels, the sonnet-4.6 and haiku-4.5 lines). The US
              # cross-region inference profiles route to the foundation model in several US regions, hence `*`.
              - Sid: InvokeEvalModels
                Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                Resource:
                  - !Sub arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/us.anthropic.claude-sonnet-4-6
                  - !Sub arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/us.anthropic.claude-haiku-4-5-20251001-v1:0
                  - !Sub arn:${AWS::Partition}:bedrock:*::foundation-model/anthropic.claude-sonnet-4-6
                  - !Sub arn:${AWS::Partition}:bedrock:*::foundation-model/anthropic.claude-haiku-4-5-20251001-v1:0

  # .github/workflows/e2e.yml (#40): on-demand E2E against the `e2e` env, in the `e2e` GitHub Environment,
  # whose deployment-branch rule decides which branches may run it (r1/Q-2 (b)); so the ref after
  # `e2e.yml@refs/heads/` is the one wildcard. Full e2e lifecycle without DeleteStack: deploy, publish the
  # SPA, reseed (seed-users.ts, seed-data.ts, --reset included). Every write is scoped to e2e; the CloudFormation
  # reads and the CloudFront invalidation are account-wide, so they reach dev too (decision 9165bd3/SPEC-1 (a)).
  GitHubE2eRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: sched-github-e2e
      Description: GitHub Actions E2E workflow (e2e.yml, e2e environment) deploys, seeds and tests the e2e env.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GitHubOidcProvider
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub: "repo:nick-delgado@25354284/serverless-ai-scheduling@1391507382:environment:e2e:job_workflow_ref:nick-delgado/serverless-ai-scheduling/.github/workflows/e2e.yml@refs/heads/*"
      Policies:
        # Copied from infra/bootstrap/sched-deployer-policy.json, narrowed to e2e. Keep in sync with it and with
        # GitHubDeployRole's copy above (the same statements for dev, without seeding). DescribeStacks differs, as
        # there (F-22, #270).
        - PolicyName: sched-github-e2e
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: Identity
                Effect: Allow
                Action: sts:GetCallerIdentity
                Resource: "*"
              - Sid: CloudFormationReadAndValidate
                Effect: Allow
                Action:
                  - cloudformation:ValidateTemplate
                  - cloudformation:GetTemplateSummary
                  - cloudformation:ListStacks
                  - cloudformation:ListExports
                Resource: "*"
              - Sid: CloudFormationDriveE2eStacks
                Effect: Allow
                Action:
                  - cloudformation:CreateStack
                  - cloudformation:UpdateStack
                  - cloudformation:CreateChangeSet
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:DeleteChangeSet
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeChangeSet
                  - cloudformation:ListChangeSets
                  - cloudformation:DescribeStackEvents
                  - cloudformation:DescribeStackResource
                  - cloudformation:DescribeStackResources
                  - cloudformation:ListStackResources
                  - cloudformation:GetTemplate
                  - cloudformation:TagResource
                Resource: !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/sched-e2e-*/*
              - Sid: SamTransform
                Effect: Allow
                Action: cloudformation:CreateChangeSet
                Resource: !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:aws:transform/Serverless-2016-10-31
              - Sid: PassOnlyTheCfnExecutionRole
                Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt CfnExecutionRole.Arn
                Condition:
                  StringEquals:
                    iam:PassedToService: cloudformation.amazonaws.com
              - Sid: ArtifactAndE2eSiteBuckets
                Effect: Allow
                Action:
                  - s3:ListBucket
                  - s3:GetBucketLocation
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                Resource:
                  - !GetAtt ArtifactBucket.Arn
                  - !Sub ${ArtifactBucket.Arn}/sched-e2e-*
                  - !Sub arn:${AWS::Partition}:s3:::sched-e2e-web-*
                  - !Sub arn:${AWS::Partition}:s3:::sched-e2e-web-*/*
              - Sid: SpaInvalidation
                Effect: Allow
                Action:
                  - cloudfront:CreateInvalidation
                  - cloudfront:GetInvalidation
                Resource: !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/*
              - Sid: SsmBootstrapAndE2eParameters
                Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters
                  - ssm:GetParametersByPath
                Resource:
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/sched/bootstrap/*
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/sched/e2e/*
              # SeedAndEvalData, narrowed to e2e tables (seed-data.ts, including --reset).
              - Sid: SeedE2eData
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                  - dynamodb:Scan
                  - dynamodb:BatchWriteItem
                  - dynamodb:BatchGetItem
                Resource:
                  - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/sched-e2e-*
                  - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/sched-e2e-*/index/GSI1
              # The calls scripts/seed-users.ts makes. User pool ARNs carry a random ID, so the pool is chosen by the
              # `env` tag that scripts/deploy.sh puts on the stack (verify first: that the auth stack's pool carries
              # it and that Cognito evaluates it for these calls; #40's first run shows it).
              - Sid: SeedE2eUsers
                Effect: Allow
                Action:
                  - cognito-idp:AdminCreateUser
                  - cognito-idp:AdminSetUserPassword
                  - cognito-idp:AdminGetUser
                Resource: !Sub arn:${AWS::Partition}:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/*
                Condition:
                  StringEquals:
                    aws:ResourceTag/env: e2e

  # ---------------------------------------------------------------------------
  # Discovery parameters for the workload stacks and scripts
  # ---------------------------------------------------------------------------
  CfnExecRoleArnParam:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /sched/bootstrap/cfn-exec-role-arn
      Type: String
      Value: !GetAtt CfnExecutionRole.Arn

  PermissionsBoundaryArnParam:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /sched/bootstrap/permissions-boundary-arn
      Type: String
      Value: !Ref WorkloadPermissionsBoundary

  ArtifactBucketParam:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /sched/bootstrap/artifact-bucket
      Type: String
      Value: !Ref ArtifactBucket

Outputs:
  CfnExecutionRoleArn:
    Description: Pass as --role-arn to sam deploy / cloudformation deploy.
    Value: !GetAtt CfnExecutionRole.Arn
  PermissionsBoundaryArn:
    Description: Every IAM role in sched-* stacks must set this as its PermissionsBoundary.
    Value: !Ref WorkloadPermissionsBoundary
  ArtifactBucketName:
    Description: S3 bucket for SAM/CloudFormation artifacts (--s3-bucket).
    Value: !Ref ArtifactBucket
  # Copied by hand into GitHub secrets (runbook, "CI credentials (GitHub OIDC)"); a workflow can't read SSM
  # before it has credentials, so these are not SSM parameters.
  GitHubDeployRoleArn:
    Description: The `dev` environment secret AWS_DEPLOY_ROLE_ARN (deploy.yml).
    Value: !GetAtt GitHubDeployRole.Arn
  GitHubEvalsRoleArn:
    Description: The repository secret AWS_EVAL_ROLE_ARN (the CI eval gate, #34).
    Value: !GetAtt GitHubEvalsRole.Arn
  GitHubE2eRoleArn:
    Description: The `e2e` environment secret AWS_E2E_ROLE_ARN (the E2E workflow, #40).
    Value: !GetAtt GitHubE2eRole.Arn
